<script>
(()=>{'use strict';
const KEY='mydoctorpay_salary_v1',V=1,MONTHS=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const SEED=[{id:'full-main',name:'常勤先',kind:'full',weekday:'',holiday:'off',startMonth:'',endMonth:'',daily:0,travelPer:0,base:0,overtime:0,bonus:0,travel:0,other:0,lag:0,health:0,pension:0,care:0,employment:0,dc:0,resident:0},{id:'weekly-off',name:'定期非常勤（祝日休み）',kind:'weekly',weekday:'',holiday:'off',startMonth:'',endMonth:'',daily:0,travelPer:0,lag:0},{id:'weekly-on',name:'定期非常勤（祝日勤務）',kind:'weekly',weekday:'',holiday:'on',startMonth:'',endMonth:'',daily:0,travelPer:0,lag:0}];
const defaultDB=()=>({version:V,employers:JSON.parse(JSON.stringify(SEED)),entries:[],taxProfiles:{},donations:{},updatedAt:null});
let data;try{const raw=localStorage.getItem(KEY);const p=raw?JSON.parse(raw):null;data=validateDB(p)?p:defaultDB()}catch{data=defaultDB()}
let ui={tab:'home',month:localMonth(),year:+localMonth().slice(0,4),modal:null},toastTimer=null;
const $=s=>document.querySelector(s), money=n=>(Math.round(Number(n)||0)).toLocaleString('ja-JP')+'円', num=x=>Number.isFinite(+x)?+x:0, int=x=>Math.round(num(x)), has=x=>x!==null&&x!==undefined&&x!=='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(Math.round(Number(n)||0)).toLocaleString('ja-JP');
const id=()=>String(Date.now())+'-'+Math.random().toString(36).slice(2,8);
function localMonth(){const d=new Date(),y=d.getFullYear(),m=d.getMonth()+1;return `${y}-${String(m).padStart(2,'0')}`}
function validMonth(x){return /^\d{4}-(0[1-9]|1[0-2])$/.test(x||'')}
function moveMonth(m,k){const [y,mm]=m.split('-').map(Number);const d=new Date(y,mm-1+k,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function monthLabel(m){return m.replace('-','年')+'月'}
function moneyInput(name,label,value,help='',nullable=false){return `<div class="field"><label for="f-${name}">${label}</label><input class="control" id="f-${name}" name="${name}" type="number" step="1" inputmode="numeric" ${nullable?'':'min="0"'} value="${has(value)?esc(value):''}" placeholder="${nullable?'未入力':'0'}">${help?`<span class="help">${help}</span>`:''}</div>`}
function textInput(name,label,value,help=''){return `<div class="field"><label for="f-${name}">${label}</label><input class="control" id="f-${name}" name="${name}" value="${esc(value)}" maxlength="90">${help?`<span class="help">${help}</span>`:''}</div>`}
function selectInput(name,label,options,value,help=''){return `<div class="field"><label for="f-${name}">${label}</label><select class="control" name="${name}" id="f-${name}">${options.map(([k,v])=>`<option value="${esc(k)}" ${String(value)===String(k)?'selected':''}>${esc(v)}</option>`).join('')}</select>${help?`<span class="help">${help}</span>`:''}</div>`}
function optNum(f,name){const s=f.elements[name]?.value?.trim();if(s===''||s===undefined)return null;const x=Number(s);if(!Number.isSafeInteger(x)||x<0||x>1e10)throw Error('金額・日数には0以上の整数を入力してください：'+name);return x}
function takeNum(f,n){return optNum(f,n)??0}
function requireNum(f,n){const x=optNum(f,n);if(x===null)throw Error('必須項目を入力してください：'+n);return x}
function validateDB(o){return !!(o&&o.version===V&&Array.isArray(o.employers)&&Array.isArray(o.entries)&&o.taxProfiles&&typeof o.taxProfiles==='object'&&o.donations&&typeof o.donations==='object'&&o.employers.length<2000&&o.entries.length<100000&&o.employers.every(e=>e&&typeof e.id==='string'&&typeof e.name==='string'&&['full','weekly','spot'].includes(e.kind))&&o.entries.every(e=>e&&typeof e.id==='string'&&typeof e.employerId==='string'&&validMonth(e.month)))}
function save(){data.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(data))}
function toast(s){clearTimeout(toastTimer);$('#toast-root').innerHTML=`<div class="toast">${esc(s)}</div>`;toastTimer=setTimeout(()=>$('#toast-root').innerHTML='',3600)}
function getEmployer(id){return data.employers.find(x=>x.id===id)}
function getEntry(id){return data.entries.find(x=>x.id===id)}
function kindName(k){return {full:'常勤',weekly:'定期非常勤',spot:'スポット'}[k]||k}
const DAYNAMES=['日','月','火','水','木','金','土'];
function firstNthMonday(y,m,n){const first=new Date(y,m-1,1).getDay();return 1+(8-first)%7+(n-1)*7}
function dayKey(y,m,d){return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function holidaySet(y){const h=new Set(),add=(m,d)=>h.add(dayKey(y,m,d));if(y<2020||y>2099)return null;
 add(1,1);add(1,firstNthMonday(y,1,2));add(2,11);add(2,23);add(3,Math.floor(20.8431+.242194*(y-1980)-Math.floor((y-1980)/4)));add(4,29);add(5,3);add(5,4);add(5,5);
 if(y===2020){add(7,23);add(7,24);add(8,10)}else if(y===2021){add(7,22);add(7,23);add(8,8)}else{add(7,firstNthMonday(y,7,3));add(8,11)}
 add(9,firstNthMonday(y,9,3));add(9,Math.floor(23.2488+.242194*(y-1980)-Math.floor((y-1980)/4)));
 add(10,firstNthMonday(y,10,2));add(11,3);add(11,23);
 // 国民の休日：前後を祝日に挟まれた平日
 for(let d=new Date(y,0,2);d.getFullYear()===y;d.setDate(d.getDate()+1)){
  const today=dayKey(y,d.getMonth()+1,d.getDate()),prev=new Date(d),next=new Date(d);prev.setDate(d.getDate()-1);next.setDate(d.getDate()+1);
  if(!h.has(today)&&d.getDay()!==0&&h.has(dayKey(prev.getFullYear(),prev.getMonth()+1,prev.getDate()))&&h.has(dayKey(next.getFullYear(),next.getMonth()+1,next.getDate())))h.add(today);
 }
 // 振替休日（祝日が日曜なら、次の祝日でない日）
 const src=[...h].sort();for(const s of src){const dt=new Date(s+'T12:00:00');if(dt.getDay()===0){let nx=new Date(dt);do{nx.setDate(nx.getDate()+1)}while(h.has(dayKey(nx.getFullYear(),nx.getMonth()+1,nx.getDate())));if(nx.getFullYear()===y)h.add(dayKey(nx.getFullYear(),nx.getMonth()+1,nx.getDate()))}}

 <div class="modal-bottom"><button type="button" class="button" data-act="close">キャンセル</button><button class="button primary" type="submit">保存</button></div></form>`);
 updateEmpFields();
}

function updateEmpFields(){const kind=$('#employer-form')?.elements.kind.value;for(const k of ['full','weekly','spot']){const el=$(`#employer-${k}`);if(el)el.classList.toggle('hidden',k!==kind)}}
function saveEmployer(f){const name=f.elements.name.value.trim(),kind=f.elements.kind.value;if(!name)throw Error('勤務先名を入力してください。');if(!['full','weekly','spot'].includes(kind))throw Error('勤務形態が不正です。');const startMonth=f.elements.startMonth.value,endMonth=f.elements.endMonth.value;if((startMonth&&!validMonth(startMonth))||(endMonth&&!validMonth(endMonth))||(startMonth&&endMonth&&endMonth<startMonth))throw Error('勤務先の開始月・終了月を確認してください');const old=getEmployer(ui.modal?.id),e={id:old?.id||id(),name,kind,lag:takeNum(f,'lag'),startMonth,endMonth,weekday:f.elements.weekday.value,holiday:f.elements.holiday.value};
 for(const n of ['daily','travelPer','base','overtime','bonus','travel','other','health','pension','care','employment','dc','resident'])e[n]=takeNum(f,n);
 if(e.lag>3)throw Error('振込までの月数を確認してください');if(old)Object.assign(old,e);else data.employers.push(e);
 save();closeModal();render();toast('勤務先を保存しました');if(!old&&e.kind==='spot'&&ui.pendingSpot){ui.pendingSpot=false;entryModal(e.id)}}
function entryModal(employerId,entryId=''){
 const e=getEmployer(employerId),r=entryId?getEntry(entryId):null;
 if(!e){toast('勤務先が見つかりません');return}
 const m=r?.month||ui.month;ui.modal={kind:'entry',id:r?.id||'',employerId};const f=forecast(e,m,r);
 const fields=e.kind==='weekly'?`
  <div class="field"><label>勤務回数</label><div class="preview"><span id="weekly-desc">${esc(f.detail.workMonth)}</span><strong id="weekly-count">${f.detail.count===null?'未設定':f.detail.count+'回'}</strong></div></div>
  ${moneyInput('daysOverride','回数変更',r?.daysOverride,'空欄で自動計算',true)}
  ${moneyInput('daily','日給',has(r?.daily)?r.daily:e.daily)}
  ${moneyInput('travelPer','交通費／回',has(r?.travelPer)?r.travelPer:e.travelPer)}
  ${moneyInput('forecastExtra','その他支給',r?.forecastExtra)}`:
  `${moneyInput('base',e.kind==='full'?'基本給':'スポット額面',has(r?.base)?r.base:e.kind==='spot'?0:e.base)}
  ${e.kind==='full'?moneyInput('overtime','残業代',has(r?.overtime)?r.overtime:e.overtime):''}
  ${e.kind==='full'?moneyInput('bonus','賞与',has(r?.bonus)?r.bonus:e.bonus):''}
  ${moneyInput('travel','非課税交通費',has(r?.travel)?r.travel:e.kind==='spot'?0:e.travel)}
  ${moneyInput('other','その他支給',has(r?.other)?r.other:e.kind==='spot'?0:e.other)}`;
 const hasDetails=Boolean(r&&['actualTravel','incomeTax','health','pension','care','employment','dc','resident','otherDeduction','memo'].some(k=>has(r[k])&&r[k]!==0));
 modal(`${e.name} · ${monthLabel(m)}`,`<form id="entry-form">
 <h3 class="subheading">予想</h3><div class="form-grid">${fields}
 <div class="field full">${moneyInput('forecastOverride','予想額面（直接入力）',r?.forecastOverride,'空欄で自動計算',true)}</div></div>
 <div class="preview" style="margin-top:12px"><span>予想額面</span><strong id="forecast-preview">${money(f.total)}</strong></div>
 <div class="divider"></div><h3 class="subheading">確定</h3><div class="form-grid">
 ${moneyInput('actualGross','確定額面',r?.actualGross,'',true)}
 ${moneyInput('actualNet','手取り',r?.actualNet,'',true)}</div>
 <details class="advanced" ${hasDetails?'open':''}><summary>控除・明細</summary><div class="form-grid">
 ${moneyInput('actualTravel','確定交通費（非課税）',has(r?.actualTravel)?r.actualTravel:f.travel)}
 ${moneyInput('incomeTax','源泉所得税',r?.incomeTax,'',true)}
 ${moneyInput('health','健康保険',has(r?.health)?r.health:(e.kind==='full'?e.health:0))}
 ${moneyInput('pension','厚生年金',has(r?.pension)?r.pension:(e.kind==='full'?e.pension:0))}
 ${moneyInput('care','介護保険',has(r?.care)?r.care:(e.kind==='full'?e.care:0))}
 ${moneyInput('employment','雇用保険',has(r?.employment)?r.employment:(e.kind==='full'?e.employment:0))}
 ${moneyInput('dc','企業型DC（本人）',has(r?.dc)?r.dc:(e.kind==='full'?e.dc:0))}
 ${moneyInput('resident','住民税',has(r?.resident)?r.resident:(e.kind==='full'?e.resident:0))}
 ${moneyInput('otherDeduction','その他控除',r?.otherDeduction)}
 <div class="field full"><label for="f-memo">メモ</label><textarea class="control" id="f-memo" name="memo" maxlength="500">${esc(r?.memo||'')}</textarea></div></div></details>
 <div class="modal-bottom"><button type="button" class="button" data-act="close">キャンセル</button><button class="button primary" type="submit">保存</button></div></form>`,true);
 updateForecastPreview();
}

function entryFormValues(f){const emp=getEmployer(ui.modal.employerId);const out={};if(emp.kind==='weekly'){out.daily=takeNum(f,'daily');out.travelPer=takeNum(f,'travelPer');out.forecastExtra=takeNum(f,'forecastExtra');out.daysOverride=optNum(f,'daysOverride')}
 else{for(const n of ['base','overtime','bonus','travel','other'])if(f.elements[n])out[n]=takeNum(f,n)}
 out.forecastOverride=optNum(f,'forecastOverride');out.actualGross=optNum(f,'actualGross');out.actualNet=optNum(f,'actualNet');if((out.actualGross===null)!==(out.actualNet===null))throw Error('確定額面と確定手取りは両方入力するか、両方空欄にしてください。');
 if(out.actualGross!==null&&out.actualNet>out.actualGross)throw Error('確定手取りが確定額面を超えています。交通費などを含む支給総額を入力してください。');
 for(const n of ['actualTravel','incomeTax','health','pension','care','employment','dc','resident','otherDeduction'])out[n]=optNum(f,n);
 if(out.actualGross!==null&&num(out.actualTravel)>out.actualGross)throw Error('非課税交通費が支給総額を超えています。');out.memo=f.elements.memo.value.trim();return out}
function saveEntry(f){const e=getEmployer(ui.modal?.employerId);if(!e)throw Error('勤務先がありません。');const out=entryFormValues(f),old=getEntry(ui.modal?.id);let entry={id:old?.id||id(),employerId:e.id,month:old?.month||ui.month,...out};if(old)Object.assign(old,entry);else data.entries.push(entry);save();closeModal();render();toast('給与を保存しました')}
function updateForecastPreview(){
 const form=$('#entry-form');if(!form||!ui.modal)return;const e=getEmployer(ui.modal.employerId);if(!e)return;
 let override=null;try{override=optNum(form,'forecastOverride')}catch{}
 const d={forecastOverride:override};
 for(const key of ['base','overtime','bonus','travel','other','daily','travelPer','forecastExtra'])if(form.elements[key])d[key]=num(form.elements[key].value);
 if(e.kind==='weekly'){
  let days=null;try{days=optNum(form,'daysOverride')}catch{}
  d.daysOverride=days;
  const w=weeklyCount(e,getEntry(ui.modal.id)?.month||ui.month,d.daysOverride);
  const desc=$('#weekly-desc'),cnt=$('#weekly-count');if(desc)desc.textContent=w.workMonth;if(cnt)cnt.textContent=w.count===null?'未設定':w.count+'回';
 }
 const f=forecast(e,getEntry(ui.modal.id)?.month||ui.month,d),el=$('#forecast-preview');if(el)el.textContent=money(f.total);
}

function csvExport(){const y=ui.year,head=['振込月','勤務先','勤務形態','予想額面','確定額面','確定手取り','確定非課税交通費','源泉所得税','健康保険','厚生年金','介護保険','雇用保険','本人拠出DC','住民税','その他控除','メモ'];let lines=[head];for(let i=1;i<=12;i++){const m=`${y}-${String(i).padStart(2,'0')}`;for(const row of rowsFor(m)){const r=row.r||{};lines.push([m,row.e.name,kindName(row.e.kind),row.f.total,has(r.actualGross)?r.actualGross:'',has(r.actualNet)?r.actualNet:'',r.actualTravel??'',r.incomeTax??'',r.health??'',r.pension??'',r.care??'',r.employment??'',r.dc??'',r.resident??'',r.otherDeduction??'',r.memo||''])}}download('\ufeff'+lines.map(line=>line.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'mydoctorpay-'+y+'.csv','text/csv;charset=utf-8');toast('CSVを保存しました')}
function download(text,filename,mime){const blob=new Blob([text],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function exportJSON(){download(JSON.stringify(data,null,2),'mydoctorpay-backup-'+new Date().toISOString().slice(0,10)+'.json','application/json');toast('バックアップを保存しました')}
function deleteEntry(entryId){const e=getEntry(entryId);if(!e||!confirm(`この月の「${getEmployer(e.employerId)?.name||'給与'}」を削除しますか？`))return;data.entries=data.entries.filter(x=>x.id!==entryId);save();render();toast('入力済み給与を削除しました')}
function deleteEmployer(eid){const e=getEmployer(eid);if(!e)return;const n=data.entries.filter(r=>r.employerId===eid).length;if(!confirm(`「${e.name}」を削除しますか？\n紐づく月別の給与入力 ${n}件も削除されます。`))return;data.entries=data.entries.filter(r=>r.employerId!==eid);data.employers=data.employers.filter(x=>x.id!==eid);save();render();toast('勤務先と紐づく給与を削除しました')}
function addSpot(){const spots=data.employers.filter(e=>e.kind==='spot');if(!spots.length){ui.pendingSpot=true;employerModal('','spot');return}if(spots.length===1){entryModal(spots[0].id);return}modal('スポット勤務先',`<div class="field"><label>勤務先</label><select id="spot-select" class="control">${spots.map(e=>`<option value="${esc(e.id)}">${esc(e.name)}</option>`).join('')}</select></div><div class="modal-bottom"><button class="button" data-act="employer" data-kind="spot">＋ 勤務先</button><button class="button primary" data-act="choose-spot">登録</button></div>`)}
function saveTax(f){const y=ui.year,p={};for(const n of ['taxableOverride','incomeAdjustment','extraSocial','extraDC','otherDeduction','taxCredit','futureWithholding','residentTaxOverride'])p[n]=optNum(f,n);data.taxProfiles[String(y)]=p;data.donations[String(y)]=takeNum(f,'donation');save();render();toast('税金・ふるさと納税の条件を保存しました')}
const actionMap={tab:(btn)=>{ui.tab=btn.dataset.tab;render();window.scrollTo(0,0)},monthmove:(btn)=>{ui.month=moveMonth(ui.month,num(btn.dataset.offset));ui.year=+ui.month.slice(0,4);render()},yearmove:(btn)=>{ui.year=Math.max(2020,Math.min(2032,ui.year+num(btn.dataset.offset)));render()},'goto-month':btn=>{ui.month=btn.dataset.month;ui.year=+ui.month.slice(0,4);ui.tab='home';render();window.scrollTo(0,0)},entry:btn=>entryModal(btn.dataset.employer,btn.dataset.id||''),'add-spot':addSpot,employer:btn=>{ui.pendingSpot=btn.dataset.kind==='spot';employerModal(btn.dataset.id||'',btn.dataset.kind||'')},close:closeModal,'remove-entry':btn=>deleteEntry(btn.dataset.id),'remove-employer':btn=>deleteEmployer(btn.dataset.id),export:exportJSON,import:()=>$('#json-upload').click(),csv:csvExport,reset:()=>{if(!confirm('このブラウザに保存した本人用の給与データをすべて削除して初期化しますか？\n取り消しはできません。先にJSONバックアップを保存してください。'))return;data=defaultDB();save();render();toast('初期化しました')},'choose-spot':()=>{const id=$('#spot-select').value;closeModal();entryModal(id)}};
document.addEventListener('click',ev=>{const btn=ev.target.closest('[data-act]');if(!btn)return;const fn=actionMap[btn.dataset.act];if(fn){ev.preventDefault();try{fn(btn)}catch(err){toast(err?.message||'操作に失敗しました')}}});
document.addEventListener('submit',ev=>{const f=ev.target;if(!['employer-form','entry-form','tax-form'].includes(f.id))return;ev.preventDefault();try{if(f.id==='employer-form')saveEmployer(f);else if(f.id==='entry-form')saveEntry(f);else saveTax(f)}catch(err){alert(err?.message||'保存できませんでした')}});
document.addEventListener('change',ev=>{const idv=ev.target.id;if(idv==='select-month'&&validMonth(ev.target.value)){ui.month=ev.target.value;ui.year=+ui.month.slice(0,4);render()}else if(idv==='select-year'){ui.year=+ev.target.value;render()}else if(idv==='f-kind')updateEmpFields();});
document.addEventListener('input',ev=>{if(ev.target.closest('#entry-form'))updateForecastPreview()});
$('#json-upload').addEventListener('change',async ev=>{const f=ev.target.files?.[0];if(!f)return;try{if(f.size>8*1024*1024)throw Error('ファイルサイズが大きすぎます');const p=JSON.parse(await f.text());if(!validateDB(p))throw Error('本人用マイドクターペイのバックアップ形式ではありません');if(!confirm('現在の本人用給与データを読み込んだファイルで置き換えますか？\n上書き前にバックアップを推奨します。'))return;data=p;save();render();toast('バックアップを復元しました')}catch(err){alert('読み込みに失敗：'+err.message)}finally{ev.target.value=''}});
window.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeModal()});
render();if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
})();
</script></body></html>
