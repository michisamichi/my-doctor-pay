<script>
(()=>{'use strict';
const KEY='mydoctorpay_salary_v1',V=1,MONTHS=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const SEED=[{id:'full-main',name:'常勤先',kind:'full',weekday:'',holiday:'off',startMonth:'',endMonth:'',daily:0,travelPer:0,base:0,overtime:0,bonus:0,travel:0,other:0,lag:0,health:0,pension:0,care:0,employment:0,dc:0,resident:0},{id:'weekly-off',name:'定期非常勤（祝日休み）',kind:'weekly',weekday:'',holiday:'off',startMonth:'',endMonth:'',daily:0,travelPer:0,lag:0},{id:'weekly-on',name:'定期非常勤（祝日勤務）',kind:'weekly',weekday:'',holiday:'on',startMonth:'',endMonth:'',daily:0,travelPer:0,lag:0}];
const defaultDB=()=>({version:V,employers:JSON.parse(JSON.stringify(SEED)),entries:[],taxProfiles:{},donations:{},updatedAt:null});
let data;try{const raw=localStorage.getItem(KEY);const p=raw?JSON.parse(raw):null;data=validateDB(p)?p:defaultDB()}catch{data=defaultDB()}
let ui={tab:'home',month:localMonth(),year:+localMonth().slice(0,4),modal:null},toastTimer=null;
const $=s=>document.querySelector(s), money=n=>(Math.round(Number(n)||0)).toLocaleString('ja-JP')+'円', num=x=>Number.isFinite(+x)?+x:0, int=x=>Math.round(num(x)), has=x=>x!==null&&x!==undefined&&x!=='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(Math.round(Number(n)||0)).toLocaleString('ja-JP');
const id=()=>String(Date.now())+'-'+Math.random().toString(36).slice(2,8);
function localMonth(){const d=new Date(),y=d.getFullYear(),m=d.getMonth()+1;return `${y}-${String(m).padStart(2,'0')}`}
function validMonth(x){return /^\d{4}-(0[1-9]|1[0-2])$/.test(x||'')}
function moveMonth(m,k){const [y,mm]=m.split('-').map(Number);const d=new Date(y,mm-1+k,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function monthLabel(m){return m.replace('-','年')+'月'}
function moneyInput(name,label,value,help='',nullable=false){return `<div class="field"><label for="f-${name}">${label}</label><input class="control" id="f-${name}" name="${name}" type="number" step="1" inputmode="numeric" ${nullable?'':'min="0"'} value="${has(value)?esc(value):''}" placeholder="${nullable?'未入力':'0'}"><span class="help">${help}</span></div>`}
function textInput(name,label,value,help=''){return `<div class="field"><label for="f-${name}">${label}</label><input class="control" id="f-${name}" name="${name}" value="${esc(value)}" maxlength="90"><span class="help">${help}</span></div>`}
function selectInput(name,label,options,value,help=''){return `<div class="field"><label for="f-${name}">${label}</label><select class="control" name="${name}" id="f-${name}">${options.map(([k,v])=>`<option value="${esc(k)}" ${String(value)===String(k)?'selected':''}>${esc(v)}</option>`).join('')}</select><span class="help">${help}</span></div>`}
function optNum(f,name){const s=f.elements[name]?.value?.trim();if(s===''||s===undefined)return null;const x=Number(s);if(!Number.isSafeInteger(x)||x<0||x>1e10)throw Error('金額・日数には0以上の整数を入力してください：'+name);return x}
function takeNum(f,n){return optNum(f,n)??0}
function requireNum(f,n){const x=optNum(f,n);if(x===null)throw Error('必須項目を入力してください：'+n);return x}
function validateDB(o){return !!(o&&o.version===V&&Array.isArray(o.employers)&&Array.isArray(o.entries)&&o.taxProfiles&&typeof o.taxProfiles==='object'&&o.donations&&typeof o.donations==='object'&&o.employers.length<2000&&o.entries.length<100000&&o.employers.every(e=>e&&typeof e.id==='string'&&typeof e.name==='string'&&['full','weekly','spot'].includes(e.kind))&&o.entries.every(e=>e&&typeof e.id==='string'&&typeof e.employerId==='string'&&validMonth(e.month)))}
function save(){data.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(data))}
function toast(s){clearTimeout(toastTimer);$('#toast-root').innerHTML=`<div class="toast">${esc(s)}</div>`;toastTimer=setTimeout(()=>$('#toast-root').innerHTML='',3600)}
function getEmployer(id){return data.employers.find(x=>x.id===id)}
function getEntry(id){return data.entries.find(x=>x.id===id)}
function kindName(k){return {full:'常勤',weekly:'定期非常勤',spot:'スポット'}[k]||k}
const DAYNAMES=['日','月','火','水','木','金','土'];
function firstNthMonday(y,m,n){const first=new Date(y,m-1,1).getDay();return 1+(8-first)%7+(n-1)*7}
function dayKey(y,m,d){return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function holidaySet(y){const h=new Set(),add=(m,d)=>h.add(dayKey(y,m,d));if(y<2020||y>2099)return null;
 add(1,1);add(1,firstNthMonday(y,1,2));add(2,11);add(2,23);add(3,Math.floor(20.8431+.242194*(y-1980)-Math.floor((y-1980)/4)));add(4,29);add(5,3);add(5,4);add(5,5);
 if(y===2020){add(7,23);add(7,24);add(8,10)}else if(y===2021){add(7,22);add(7,23);add(8,8)}else{add(7,firstNthMonday(y,7,3));add(8,11)}
 add(9,firstNthMonday(y,9,3));add(9,Math.floor(23.2488+.242194*(y-1980)-Math.floor((y-1980)/4)));
 add(10,firstNthMonday(y,10,2));add(11,3);add(11,23);
 // 国民の休日：前後を祝日に挟まれた平日
 for(let d=new Date(y,0,2);d.getFullYear()===y;d.setDate(d.getDate()+1)){
  const today=dayKey(y,d.getMonth()+1,d.getDate()),prev=new Date(d),next=new Date(d);prev.setDate(d.getDate()-1);next.setDate(d.getDate()+1);
  if(!h.has(today)&&d.getDay()!==0&&h.has(dayKey(prev.getFullYear(),prev.getMonth()+1,prev.getDate()))&&h.has(dayKey(next.getFullYear(),next.getMonth()+1,next.getDate())))h.add(today);
 }
 // 振替休日（祝日が日曜なら、次の祝日でない日）
 const src=[...h].sort();for(const s of src){const dt=new Date(s+'T12:00:00');if(dt.getDay()===0){let nx=new Date(dt);do{nx.setDate(nx.getDate()+1)}while(h.has(dayKey(nx.getFullYear(),nx.getMonth()+1,nx.getDate())));if(nx.getFullYear()===y)h.add(dayKey(nx.getFullYear(),nx.getMonth()+1,nx.getDate()))}}
 return h}
function weeklyCount(employer,depositMonth,override=null){if(override!==null&&override!==undefined&&override!=='')return {count:+override,source:'修正日数',workMonth:moveMonth(depositMonth,-num(employer.lag))};
 const workMonth=moveMonth(depositMonth,-num(employer.lag));if(employer.weekday===''||employer.weekday===null||employer.weekday===undefined)return{count:null,source:'曜日未設定',workMonth};
 const [y,m]=workMonth.split('-').map(Number),h=holidaySet(y);if(!h)return {count:null,source:'祝日計算対象外（2020〜2099年）',workMonth};let count=0,all=0,hol=0;
 for(let d=1;d<=new Date(y,m,0).getDate();d++){const date=new Date(y,m-1,d);if(date.getDay()!==+employer.weekday)continue;all++;const isHoliday=h.has(dayKey(y,m,d));if(isHoliday)hol++;if(employer.holiday==='on'||!isHoliday)count++}
 return{count,all,hol,source:employer.holiday==='on'?'祝日勤務':'祝日休み',workMonth}}
function forecast(e,month,entry){const val=n=>entry&&has(entry[n])?num(entry[n]):num(e[n]);const manual=entry&&has(entry.forecastOverride)?num(entry.forecastOverride):null;
 if(e.kind==='weekly'){const w=weeklyCount(e,month,entry?.daysOverride);const base=w.count===null?0:w.count*val('daily'),travel=w.count===null?0:w.count*val('travelPer');const extra=entry?num(entry.forecastExtra):0;return {total:manual??base+travel+extra,taxable:manual!==null?Math.max(0,manual-travel):base+extra,travel,base,extra,detail:w,hasForecast:manual!==null||w.count!==null}}
 const base=val('base'),overtime=val('overtime'),bonus=val('bonus'),travel=val('travel'),other=val('other');return{total:manual??base+overtime+bonus+travel+other,taxable:manual!==null?Math.max(0,manual-travel):base+overtime+bonus+other,travel,base,overtime,bonus,other,hasForecast:true}}
function rowsFor(m){const rows=[];for(const e of data.employers.filter(e=>e.kind!=='spot'&&((!e.startMonth||m>=e.startMonth)&&(!e.endMonth||m<=e.endMonth)||data.entries.some(r=>r.month===m&&r.employerId===e.id)))){const ent=data.entries.find(r=>r.month===m&&r.employerId===e.id);rows.push({e,r:ent||null,f:forecast(e,m,ent)})}
 for(const r of data.entries.filter(r=>r.month===m)){const e=getEmployer(r.employerId);if(e&&e.kind==='spot')rows.push({e,r,f:forecast(e,m,r)})}
 return rows}
function confirmed(r){return r&&has(r.actualGross)&&has(r.actualNet)}
function actualGross(r){return confirmed(r)?num(r.actualGross):null}
function rowGross(row){return confirmed(row.r)?actualGross(row.r):row.f.total}

function monthPage(){const rows=rowsFor(ui.month),t=totals(rows);return topbar('month','月別給与',monthControl())+`<section class="hero"><div><h2>${monthLabel(ui.month)} の給与</h2><p>予想額面の入力・修正と、振込後の確定額面・手取り登録を同じ画面で管理します。</p></div><div><div class="hero-number">${money(t.adopted)}</div><div class="hero-label">確定分優先の合計</div></div></section><div class="kpi-grid"><div class="card kpi"><div class="title">予想額面</div><div class="value">${money(t.forecast)}</div></div><div class="card kpi"><div class="title">確定額面</div><div class="value">${money(rows.reduce((s,x)=>s+(confirmed(x.r)?num(x.r.actualGross):0),0))}</div></div><div class="card kpi"><div class="title">確定手取り</div><div class="value">${money(t.net)}</div></div><div class="card kpi"><div class="title">確定件数</div><div class="value">${t.confirmed} / ${t.count}</div></div></div><section class="card" style="margin-top:18px"><div class="card-heading"><h2>勤務先別の給与</h2><button class="button primary" data-act="add-spot">＋ スポット給与を追加</button></div>${rows.length?rows.map(rowLine).join(''):'<div class="empty">勤務先がまだありません</div>'}</section><div class="info-box" style="margin-top:15px"><strong>振込月で管理します</strong>例えば10月勤務分を11月に振り込む勤務先は、勤務先設定の「振込までの月数」を1にします。予想額は11月の月別給与へ表示します。祝日勤務の判定は勤務月を基準に行います。</div>`}
function yearPage(){const y=ui.year,months=annualRows(y),t=yearTotal(y),mx=Math.max(1,...months.map(rs=>totals(rs).adopted));const all=months.flat();const cats=['full','weekly','spot'].map(kind=>({kind,value:all.filter(x=>x.e.kind===kind).reduce((s,x)=>s+rowGross(x),0)}));return topbar('year','年間給与の集計',yearControl())+`<section class="hero"><div><h2>${y}年の額面見込み</h2><p>1〜12月の振込ベース。確定額面と今後の予想額面を合算します。</p></div><div><div class="hero-number">${money(t.adopted)}</div><div class="hero-label">交通費込み</div></div></section><div class="kpi-grid"><div class="card kpi"><div class="title">年間予想額面</div><div class="value">${money(t.forecast)}</div></div><div class="card kpi"><div class="title">給与確定件数</div><div class="value">${t.confirmed}件</div></div><div class="card kpi"><div class="title">確定手取り合計</div><div class="value">${money(t.net)}</div></div><div class="card kpi"><div class="title">課税給与収入見込み</div><div class="value">${money(t.taxable)}</div><div class="detail">非課税交通費を除いた概算</div></div></div><section class="card" style="margin-top:18px"><div class="card-heading"><h2>月別の額面と確定手取り</h2><span class="pill gray">振込月別</span></div><div class="year-bars">${months.map((rows,i)=>{const p=totals(rows);return `<div class="bar-col"><div class="bar-inner"><div class="bar" title="${MONTHS[i]} 額面 ${money(p.adopted)}" style="height:${p.adopted?Math.max(2,p.adopted/mx*100):0}%"></div><div class="bar net" title="${MONTHS[i]} 確定手取り ${money(p.net)}" style="height:${p.net?Math.max(2,p.net/mx*100):0}%"></div></div><div class="bar-label">${i+1}月</div></div>`}).join('')}</div><div class="legend" style="margin-top:13px"><span><b style="background:#9ed4d0"></b>額面（確定優先）</span><span><b style="background:#226b86"></b>確定手取り</span></div></section><div class="section-grid" style="margin-top:18px"><section class="card"><div class="card-heading"><h2>勤務形態別の内訳</h2></div>${cats.map(c=>`<div class="rowline"><span>${kindName(c.kind)}</span><b>${money(c.value)}</b></div>`).join('')}</section><section class="card"><div class="card-heading"><h2>給与の見方</h2></div><div class="info-box"><strong>確定と予想を混在させて年収を見積もり</strong>確定額面がある月はその数値を優先し、未確定分は予想額を採用します。手取りの見込みは自動推定せず、確定済みの手取りのみを集計します。</div></section></div><section class="card" style="margin-top:18px"><div class="card-heading"><h2>月別一覧</h2></div><div class="table-scroll"><table><thead><tr><th>振込月</th><th class="num">予想額面</th><th class="num">確定優先の額面</th><th class="num">確定手取り</th><th class="num">確定件数</th><th></th></tr></thead><tbody>${months.map((rs,i)=>{const p=totals(rs),m=`${y}-${String(i+1).padStart(2,'0')}`;return `<tr><td>${i+1}月</td><td class="num">${money(p.forecast)}</td><td class="num"><b>${money(p.adopted)}</b></td><td class="num">${money(p.net)}</td><td class="num">${p.confirmed}/${p.count}</td><td><button class="button sm" data-act="goto-month" data-month="${m}">編集</button></td></tr>`}).join('')}</tbody></table></div></section>`}
function taxProfile(y){return data.taxProfiles[String(y)]||{}}
function salaryDeduction(gross,y){if(gross<=0)return 0;let min=(y===2026||y===2027)?690000:650000;return Math.min(gross,Math.max(gross<=1900000?min:gross<=3600000?gross*.3+80000:gross<=6600000?gross*.2+440000:gross<=8500000?gross*.1+1100000:1950000,0))}
function basicDeduction(income,y){if(income>25000000)return 0;if(income>24500000)return 160000;if(income>24000000)return 320000;if(income>23500000)return 480000;if(y===2026||y===2027)return income<=4890000?1040000:income<=6550000?670000:620000;return income<=1320000?950000:income<=3360000?880000:income<=4890000?680000:income<=6550000?630000:580000}
function incomeTax(taxable){const t=Math.floor(Math.max(0,taxable)/1000)*1000,ranges=[[1950000,.05,0],[3300000,.1,97500],[6950000,.2,427500],[9000000,.23,636000],[18000000,.33,1536000],[40000000,.4,2796000],[Infinity,.45,4796000]];for(const [cap,rate,less] of ranges)if(t<=cap)return Math.max(0,Math.round((t*rate-less)*1.021));return 0}
function marginalRate(taxable){const t=Math.max(0,taxable);return t<=1950000?.05:t<=3300000?.1:t<=6950000?.2:t<=9000000?.23:t<=18000000?.33:t<=40000000?.4:.45}
function taxProjection(y){const p=taxProfile(y),rows=annualRows(y).flat(),grossAuto=rows.reduce((s,row)=>s+rowTaxable(row),0),gross=has(p.taxableOverride)?num(p.taxableOverride):grossAuto;
 const salaryIncome=Math.max(0,gross-salaryDeduction(gross,y)-num(p.incomeAdjustment));const basic=basicDeduction(salaryIncome,y);
 let social=0,dc=0,withheld=0,missingTax=0,confirmedCount=0;
 for(const row of rows){const r=row.r;let isConfirmed=confirmed(r);if(isConfirmed){confirmedCount++;social+=['health','pension','care','employment'].reduce((s,k)=>s+num(r[k]),0);dc+=num(r.dc);if(has(r.incomeTax))withheld+=num(r.incomeTax);else missingTax++}else{const e=row.e;if(e.kind==='full'){social+=['health','pension','care','employment'].reduce((s,k)=>s+num(e[k]),0);dc+=num(e.dc)}}}
 social+=num(p.extraSocial);dc+=num(p.extraDC);
 const deductions=basic+social+dc+num(p.otherDeduction);const taxableIncome=Math.max(0,salaryIncome-deductions);const estimate=Math.max(0,incomeTax(taxableIncome)-num(p.taxCredit));const annualWithheld=withheld+num(p.futureWithholding);
 const residentTaxable=Math.max(0,salaryIncome-430000-social-dc-num(p.otherDeduction));const residentBase=residentTaxable*.1;const residentIncomeBased=has(p.residentTaxOverride)?num(p.residentTaxOverride):residentBase;
 const rate=marginalRate(taxableIncome);const cap=Math.max(2000,Math.floor((residentIncomeBased*.2/(.9-rate*1.021)+2000)/1000)*1000);
 return{p,rows,grossAuto,gross,salaryIncome,basic,social,dc,deductions,taxableIncome,estimate,annualWithheld,withheld,missingTax,confirmedCount,residentIncomeBased,rate,cap,difference:annualWithheld-estimate,donation:num(data.donations[String(y)]),supported:[2026,2027].includes(y)} }

function entryModal(employerId,entryId=''){const e=getEmployer(employerId),r=entryId?getEntry(entryId):null;if(!e){toast('勤務先が見つかりません');return}const m=r?.month||ui.month;ui.modal={kind:'entry',id:r?.id||'',employerId};const f=forecast(e,m,r),actual=confirmed(r);
 const fields=e.kind==='weekly'?`${selectInput('daysType','勤務回数を変更する方法',[['auto','毎週の曜日と祝日から自動計算'],['manual','その月だけ勤務回数を直接入力']],has(r?.daysOverride)?'manual':'auto')}<div class="field"><label>予想勤務回数（振込月に対応する勤務月）</label><div class="preview"><span id="weekly-desc">${esc(f.detail.workMonth)}／${esc(f.detail.source)}</span><strong id="weekly-count">${f.detail.count===null?'未設定':f.detail.count+'回'}</strong></div></div>${moneyInput('daysOverride','勤務回数の手入力',r?.daysOverride,'自動計算から変更したい月だけ入力。0回も指定できます。',true)}${moneyInput('daily','1回の給与額（今月分）',has(r?.daily)?r.daily:e.daily)}${moneyInput('travelPer','1回の非課税交通費',has(r?.travelPer)?r.travelPer:e.travelPer)}${moneyInput('forecastExtra','臨時の課税支給額',r?.forecastExtra)}`:`${moneyInput('base',e.kind==='full'?'基本給の見込み':'スポット給与額面',has(r?.base)?r.base:e.kind==='spot'?0:e.base)}${e.kind==='full'?moneyInput('overtime','残業代の見込み',has(r?.overtime)?r.overtime:e.overtime):''}${e.kind==='full'?moneyInput('bonus','賞与の見込み',has(r?.bonus)?r.bonus:e.bonus):''}${moneyInput('travel','非課税交通費',has(r?.travel)?r.travel:e.kind==='spot'?0:e.travel)}${moneyInput('other','その他の課税支給額',has(r?.other)?r.other:e.kind==='spot'?0:e.other)}`;
 modal(`${e.name}｜${monthLabel(m)}`,`<form id="entry-form"><div class="info-box" style="margin-bottom:16px"><strong>${esc(e.name)} <span class="tag">${kindName(e.kind)}</span></strong>振込月：${monthLabel(m)}。勤務日付の入力は不要です。予想額の手入力があれば自動計算より優先します。</div><h3 class="subheading">1. 振込前の額面予想</h3><div class="form-grid">${fields}<div class="field full">${moneyInput('forecastOverride','予想額面を直接指定（任意）',r?.forecastOverride,'すでにご自身で月額予想がある場合はこちらに入力。未入力で自動計算。',true)}</div></div><div class="preview" style="margin-top:13px"><span>今月の予想額面（交通費込み）</span><strong id="forecast-preview">${money(f.total)}</strong></div><div class="divider"></div><h3 class="subheading">2. 給与振込後の確定値</h3><div class="form-grid">${moneyInput('actualGross','確定した額面（支給総額）',r?.actualGross,'未振込なら空欄。額面と手取りはセットで入力します。',true)}${moneyInput('actualNet','確定した手取り（振込金額）',r?.actualNet,'未振込なら空欄。',true)}${moneyInput('actualTravel','確定額面に含まれる非課税交通費',has(r?.actualTravel)?r.actualTravel:f.travel,'課税給与収入から差し引きます。')}${moneyInput('incomeTax','源泉所得税（復興特別所得税込）',r?.incomeTax,'税額試算・還付差額に使用。分からない場合は空欄。',true)}${moneyInput('health','健康保険料',has(r?.health)?r.health:(e.kind==='full'?e.health:0),'常勤先では給与明細を見ながら入力。')}${moneyInput('pension','厚生年金保険料',has(r?.pension)?r.pension:(e.kind==='full'?e.pension:0))}${moneyInput('care','介護保険料',has(r?.care)?r.care:(e.kind==='full'?e.care:0))}${moneyInput('employment','雇用保険料',has(r?.employment)?r.employment:(e.kind==='full'?e.employment:0))}${moneyInput('dc','企業型DC（本人拠出分）',has(r?.dc)?r.dc:(e.kind==='full'?e.dc:0),'会社拠出分は入力しないでください。')}${moneyInput('resident','住民税',has(r?.resident)?r.resident:(e.kind==='full'?e.resident:0))}${moneyInput('otherDeduction','その他の控除',r?.otherDeduction)}<div class="field full"><label for="f-memo">メモ（任意）</label><textarea class="control" id="f-memo" name="memo" maxlength="500" placeholder="賞与・残業・調整など">${esc(r?.memo||'')}</textarea></div></div><div class="info-box warning" style="margin-top:13px"><strong>控除額の確認</strong>額面－手取りが控除総額です。源泉所得税は社会保険料やDCと別に入力してください。不明な源泉税を差額から自動推定しません。</div><div function entryFormValues(f){const emp=getEmployer(ui.modal.employerId);const out={};if(emp.kind==='weekly'){out.daily=takeNum(f,'daily');out.travelPer=takeNum(f,'travelPer');out.forecastExtra=takeNum(f,'forecastExtra');out.daysOverride=f.elements.daysType.value==='manual'?optNum(f,'daysOverride'):null;if(f.elements.daysType.value==='manual'&&out.daysOverride===null)throw Error('勤務回数の手入力を選んだ場合は日数を入力してください。')}
 else{for(const n of ['base','overtime','bonus','travel','other'])if(f.elements[n])out[n]=takeNum(f,n)}
 out.forecastOverride=optNum(f,'forecastOverride');out.actualGross=optNum(f,'actualGross');out.actualNet=optNum(f,'actualNet');if((out.actualGross===null)!==(out.actualNet===null))throw Error('確定額面と確定手取りは両方入力するか、両方空欄にしてください。');

function updateForecastPreview(){const form=$('#entry-form');if(!form||!ui.modal)return;const e=getEmployer(ui.modal.employerId);if(!e)return;let override=null;try{override=optNum(form,'forecastOverride')}catch{}let d={forecastOverride:override};for(const key of ['base','overtime','bonus','travel','other','daily','travelPer','forecastExtra'])if(form.elements[key])d[key]=num(form.elements[key].value);

function csvExport(){const y=ui.year,head=['振込月','勤務先','勤務形態','予想額面','確定額面','確定手取り','確定非課税交通費','源泉所得税','健康保険','厚生年金','介護保険','雇用保険','本人拠出DC','住民税','その他控除','メモ'];let lines=[head];for(let i=1;i<=12;i++){const m=`${y}-${String(i).padStart(2,'0')}`;for(const row of rowsFor(m)){const r=row.r||{};lines.push([m,row.e.name,kindName(row.e.kind),row.f.total,has(r.actualGross)?r.actualGross:'',has(r.actualNet)?r.actualNet:'',r.actualTravel??'',r.incomeTax??'',r.health??'',r.pension??'',r.care??'',r.employment??'',r.dc??'',r.resident??'',r.otherDeduction??'',r.memo||''])}}download('\ufeff'+lines.map(line=>line.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'mydoctorpay-'+y+'.csv','text/csv;charset=utf-8');toast('CSVを保存しました')}

function deleteEmployer(eid){const e=getEmployer(eid);if(!e)return;const n=data.entries.filter(r=>r.employerId===eid).length;if(!confirm(`「${e.name}」を削除しますか？\n紐づく月別の給与入力 ${n}件も削除されます。`))return;data.entries=data.entries.filter(r=>r.employerId!==eid);data.employers=data.employers.filter(x=>x.id!==eid);save();render();toast('勤務先と紐づく給与を削除しました')}
function addSpot(){const spots=data.employers.filter(e=>e.kind==='spot');if(!spots.length){ui.pendingSpot=true;employerModal('','spot');return}if(spots.length===1){entryModal(spots[0].id);return}modal('スポット給与の勤務先を選択',`<div class="field"><label>勤務先</label><select id="spot-select" class="control">${spots.map(e=>`<option value="${esc(e.id)}">${esc(e.name)}</option>`).join('')}</select></div><div class="modal-bottom"><button class="button" data-act="employer" data-kind="spot">＋ 新しい勤務先</button><button class="button primary" data-act="choose-spot">この勤務先で登録</button></div>`)}
function saveTax(f){const y=ui.year,p={};for(const n of ['taxableOverride','incomeAdjustment','extraSocial','extraDC','otherDeduction','taxCredit','futureWithholding','residentTaxOverride'])p[n]=optNum(f,n);data.taxProfiles[String(y)]=p;data.donations[String(y)]=takeNum(f,'donation');save();render();toast('税金・ふるさと納税の条件を保存しました')}
const actionMap={tab:(btn)=>{ui.tab=btn.dataset.tab;render();window.scrollTo(0,0)},monthmove:(btn)=>{ui.month=moveMonth(ui.month,num(btn.dataset.offset));ui.year=+ui.month.slice(0,4);render()},yearmove:(btn)=>{ui.year=Math.max(2020,Math.min(2032,ui.year+num(btn.dataset.offset)));render()},'goto-month':btn=>{ui.month=btn.dataset.month;ui.year=+ui.month.slice(0,4);ui.tab='month';render();window.scrollTo(0,0)},entry:btn=>entryModal(btn.dataset.employer,btn.dataset.id||''),'add-spot':addSpot,employer:btn=>{ui.pendingSpot=btn.dataset.kind==='spot';employerModal(btn.dataset.id||'',btn.dataset.kind||'')},close:closeModal,'remove-entry':btn=>deleteEntry(btn.dataset.id),'remove-employer':btn=>deleteEmployer(btn.dataset.id),export:exportJSON,import:()=>$('#json-upload').click(),csv:csvExport,reset:()=>{if(!confirm('このブラウザに保存した本人用の給与データをすべて削除して初期化しますか？\n取り消しはできません。先にJSONバックアップを保存してください。'))return;data=defaultDB();save();render();toast('初期化しました')},'choose-spot':()=>{const id=$('#spot-select').value;closeModal();entryModal(id)}};
document.addEventListener('click',ev=>{const btn=ev.target.closest('[data-act]');if(!btn)return;const fn=actionMap[btn.dataset.act];if(fn){ev.preventDefault();try{fn(btn)}catch(err){toast(err?.message||'操作に失敗しました')}}});
document.addEventListener('submit',ev=>{const f=ev.target;if(!['employer-form','entry-form','tax-form'].includes(f.id))return;ev.preventDefault();try{if(f.id==='employer-form')saveEmployer(f);else if(f.id==='entry-form')saveEntry(f);else saveTax(f)}catch(err){alert(err?.message||'保存できませんでした')}});
document.addEventListener('change',ev=>{const idv=ev.target.id;if(idv==='select-month'&&validMonth(ev.target.value)){ui.month=ev.target.value;ui.year=+ui.month.slice(0,4);render()}else if(idv==='select-year'){ui.year=+ev.target.value;render()}else if(idv==='f-kind')updateEmpFields();else if(idv==='f-daysType'){const e=$('#f-daysOverride');if(e){if(ev.target.value==='auto')e.value='';else if(!e.value){const x=getEmployer(ui.modal?.employerId);const n=weeklyCount(x,getEntry(ui.modal?.id)?.month||ui.month).count;e.value=n===null?'':n}}updateForecastPreview()}});
document.addEventListener('input',ev=>{if(ev.target.closest('#entry-form'))updateForecastPreview()});
$('#json-upload').addEventListener('change',async ev=>{const f=ev.target.files?.[0];if(!f)return;try{if(f.size>8*1024*1024)throw Error('ファイルサイズが大きすぎます');const p=JSON.parse(await f.text());if(!validateDB(p))throw Error('本人用マイドクターペイのバックアップ形式ではありません');if(!confirm('現在の本人用給与データを読み込んだファイルで置き換えますか？\n上書き前にバックアップを推奨します。'))return;data=p;save();render();toast('バックアップを復元しました')}catch(err){alert('読み込みに失敗：'+err.message)}finally{ev.target.value=''}});
window.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeModal()});
render();if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
})();
</script></body></html>
