<script>
(()=>{'use strict';
const KEY='mydoctorpay_v14_clean', VERSION=2;
const $=s=>document.querySelector(s);
const money=x=>`${Math.round(Number(x)||0).toLocaleString('ja-JP')}円`;
const signedMoney=x=>`${x>0?'+':x<0?'−':''}${money(Math.abs(x))}`;
const n=x=>Number.isFinite(Number(x))?Number(x):0;
const has=x=>x!==null&&x!==undefined&&x!=='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>`${Date.now()}-${Math.random().toString(36).slice(2,7)}`;
const monthKey=(y,m)=>`${y}-${String(m).padStart(2,'0')}`;
const todayMonth=()=>monthKey(new Date().getFullYear(),new Date().getMonth()+1);
const moveMonth=(m,delta)=>{const [y,mm]=m.split('-').map(Number);const d=new Date(y,mm-1+delta,1);return monthKey(d.getFullYear(),d.getMonth()+1)};
const dayISO=d=>`${monthKey(d.getFullYear(),d.getMonth()+1)}-${String(d.getDate()).padStart(2,'0')}`;
const validMonth=m=>/^\d{4}-(0[1-9]|1[0-2])$/.test(m||'');
const monthText=m=>`${m.slice(0,4)}年${Number(m.slice(5))}月`;
const mkDefault=()=>({version:VERSION,employers:[
 {id:'full',name:'常勤先',kind:'full',closeDay:32,payDay:25,lag:0,forecastTotal:0,travel:0,dc:0},
 {id:'weekly-off',name:'定期非常勤（祝休）',kind:'weekly',closeDay:32,payDay:25,lag:1,weekday:'',holiday:false,daily:0,travelPer:0},
 {id:'weekly-on',name:'定期非常勤（祝勤務）',kind:'weekly',closeDay:32,payDay:25,lag:1,weekday:'',holiday:true,daily:0,travelPer:0}
 ],entries:[],tax:{}});
function validDB(x){return !!(x&&x.version===VERSION&&Array.isArray(x.employers)&&Array.isArray(x.entries)&&typeof x.tax==='object'&&x.tax!==null&&x.employers.length<300&&x.entries.length<15000&&x.employers.every(e=>e&&typeof e.id==='string'&&typeof e.name==='string'&&['full','weekly','spot'].includes(e.kind))&&x.entries.every(r=>r&&typeof r.employerId==='string'&&validMonth(r.month)));}
let db;try{const x=JSON.parse(localStorage.getItem(KEY));db=validDB(x)?x:mkDefault()}catch{db=mkDefault()}
const ui={tab:'home',month:todayMonth(),year:+todayMonth().slice(0,4),modal:null};
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function toast(t){$('#toast-root').innerHTML=`<div class="toast">${esc(t)}</div>`;clearTimeout(toast._timer);toast._timer=setTimeout(()=>$('#toast-root').innerHTML='',3000)}
function getEmp(id){return db.employers.find(e=>e.id===id)}
function getEntry(eid,month){return db.entries.find(r=>r.employerId===eid&&r.month===month)}
const wd=['日','月','火','水','木','金','土'];
const optDays=(allowZero=false)=>[...(allowZero?[['0','未設定']]:[]),['32','末日'],...Array.from({length:31},(_,i)=>[String(i+1),`${i+1}日`])];
const nameDay=d=>!n(d)?'未設定':n(d)===32?'末日':`${d}日`;
const lagText=k=>['当月','翌月','翌々月','3か月後'][n(k)]||`${k}か月後`;
function dateAt(m,day){const [y,mo]=m.split('-').map(Number);return new Date(y,mo-1,n(day)===32?new Date(y,mo,0).getDate():Math.min(Math.max(1,n(day)),new Date(y,mo,0).getDate()),12);}
function nthMonday(y,m,k){const d=new Date(y,m-1,1).getDay();return 1+(8-d)%7+(k-1)*7;}
function holidayYear(y){const base=new Set(),add=(m,d)=>base.add(dayISO(new Date(y,m-1,d,12)));
 if(y<2020||y>2099)return base;
 add(1,1);add(1,nthMonday(y,1,2));add(2,11);add(2,23);
 add(3,Math.floor(20.8431+.242194*(y-1980)-Math.floor((y-1980)/4)));add(4,29);
 add(5,3);add(5,4);add(5,5);
 if(y===2020){add(7,23);add(7,24);add(8,10)}else if(y===2021){add(7,22);add(7,23);add(8,8)}else{add(7,nthMonday(y,7,3));add(8,11)}
 add(9,nthMonday(y,9,3));add(9,Math.floor(23.2488+.242194*(y-1980)-Math.floor((y-1980)/4)));add(10,nthMonday(y,10,2));add(11,3);add(11,23);
 const holidays=new Set(base);
 // 振替休日：日曜日と重なる祝日から最初の非祝日へ
 for(const s of [...base].sort()){const d=new Date(s+'T12:00:00');if(d.getDay()!==0)continue;do{d.setDate(d.getDate()+1)}while(holidays.has(dayISO(d)));holidays.add(dayISO(d));}
 // 国民の休日：前後が祝日の平日
 for(let d=new Date(y,0,2,12);d.getFullYear()===y;d.setDate(d.getDate()+1)){
  const before=new Date(d),after=new Date(d);before.setDate(d.getDate()-1);after.setDate(d.getDate()+1);
  if(d.getDay()!==0&&!holidays.has(dayISO(d))&&holidays.has(dayISO(before))&&holidays.has(dayISO(after)))holidays.add(dayISO(d));
 }
 return holidays;
}
const hc=new Map();function isHoliday(d){const y=d.getFullYear();if(!hc.has(y))hc.set(y,holidayYear(y));return hc.get(y).has(dayISO(d))}
function isBankOff(d){const m=d.getMonth()+1,da=d.getDate();return d.getDay()===0||d.getDay()===6||isHoliday(d)||(m===12&&da===31)||(m===1&&da<=3)}
function advanceToWorkday(d){const a=new Date(d);for(let i=0;i<20&&isBankOff(a);i++)a.setDate(a.getDate()-1);return a}
function period(e,m){const endMonth=moveMonth(m,-n(e.lag));const prevMonth=moveMonth(endMonth,-1);const end=dateAt(endMonth,e.closeDay??32),start=dateAt(prevMonth,e.closeDay??32);start.setDate(start.getDate()+1);return {start,end}}
function weekCount(e,m,entry){const p=period(e,m);if(e.weekday===''||e.weekday===undefined||e.weekday===null)return {days:has(entry?.daysOverride)?n(entry.daysOverride):null,...p};let days=0;for(const d=new Date(p.start);d<=p.end;d.setDate(d.getDate()+1))if(d.getDay()===Number(e.weekday)&&(e.holiday||!isHoliday(d)))days++;return {days:has(entry?.daysOverride)?n(entry.daysOverride):days,...p};}
function forecast(e,m,entry){if(e.kind==='weekly'){
 const w=weekCount(e,m,entry),count=w.days||0,daily=has(entry?.daily)?n(entry.daily):n(e.daily),travelPer=has(entry?.travelPer)?n(entry.travelPer):n(e.travelPer);
 const taxable=has(entry?.forecastTaxable)?n(entry.forecastTaxable):count*daily,travel=has(entry?.forecastTravel)?n(entry.forecastTravel):count*travelPer;
 return {taxable,travel,total:taxable+travel,dc:0,days:w.days,period:w};}
 if(e.kind==='full'){
 const total=has(entry?.forecastTotal)?n(entry.forecastTotal):n(e.forecastTotal),travel=has(entry?.travel)?n(entry.travel):n(e.travel),dc=has(entry?.dc)?n(entry.dc):n(e.dc);
 return {total,travel,dc,taxable:Math.max(0,total-travel+dc)};}
 return {taxable:n(entry?.forecastTaxable),travel:n(entry?.forecastTravel),total:n(entry?.forecastTaxable)+n(entry?.forecastTravel),dc:0};
}
function isConfirmed(e,r){return !!(r&&(e.kind==='full'?['actualTotal','social','incomeTax','resident'].every(k=>has(r[k])):['actualGross','actualTravel','actualNet'].every(k=>has(r[k]))));}
function actual(e,r){if(!isConfirmed(e,r))return null;if(e.kind==='full'){
 const cash=n(r.actualTotal),travel=n(r.travel),dc=n(r.dc);return {total:cash,taxable:Math.max(0,cash-travel+dc),travel,net:cash-n(r.social)-n(r.incomeTax)-n(r.resident),incomeTax:n(r.incomeTax),social:n(r.social),resident:n(r.resident),dc};}
 const taxable=n(r.actualGross),travel=n(r.actualTravel),net=n(r.actualNet);return {total:taxable+travel,taxable,travel,net,incomeTax:taxable+travel-net,social:0,resident:0,dc:0};
}
function paymentDate(e,m,r){if(r?.depositDate){const x=new Date(`${r.depositDate}T12:00:00`);if(!Number.isNaN(+x)&&dayISO(x)===r.depositDate)return advanceToWorkday(x);}if(!n(e.payDay))return null;return advanceToWorkday(dateAt(m,e.payDay));}
function activeFor(e,m){return (!e.startMonth||e.startMonth<=m)&&(!e.endMonth||e.endMonth>=m);}
function salaryRows(m){
 const seen=new Set(),rows=[];
 // 基準月より後の月の給与が前倒し入金される場合に対応
 const candidates=[m,moveMonth(m,1)];
 for(const scheduled of candidates)for(const e of db.employers){
  const entry=getEntry(e.id,scheduled),auto=e.kind!=='spot'&&activeFor(e,scheduled);
  if(!auto&&!entry)continue;
  const key=`${e.id}::${scheduled}`;if(seen.has(key))continue;seen.add(key);
  const date=paymentDate(e,scheduled,entry);
  if((date&&dayISO(date).slice(0,7)!==m)||(!date&&scheduled!==m))continue;
  rows.push({e,r:entry||null,scheduled,date,f:forecast(e,scheduled,entry)});
 }
 // 臨時変更で振込月が飛んだ場合も表示
 for(const r of db.entries){const e=getEmp(r.employerId);if(!e||seen.has(`${e.id}::${r.month}`))continue;
  const date=paymentDate(e,r.month,r);if(date&&dayISO(date).slice(0,7)===m){rows.push({e,r,scheduled:r.month,date,f:forecast(e,r.month,r)});seen.add(`${e.id}::${r.month}`)}}
 return rows.sort((a,b)=>(a.date?dayISO(a.date):'9999').localeCompare(b.date?dayISO(b.date):'9999')||a.e.name.localeCompare(b.e.name));
}
function sumRows(rows){return rows.reduce((o,x)=>{const a=actual(x.e,x.r);o.forecast+=x.f.total;o.expected+=a?a.total:x.f.total;o.confirmedGross+=a?a.total:0;o.net+=a?a.net:0;o.confirmed+=a?1:0;o.count++;return o;},{forecast:0,expected:0,confirmedGross:0,net:0,confirmed:0,count:0});}
function annualRows(y){return Array.from({length:12},(_,k)=>salaryRows(monthKey(y,k+1)));}
function yearRows(y){return annualRows(y).flat();}
const ICON={home:'<path d="m3 10 9-7 9 7"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-7h6v7"/>',list:'<path d="M9 6h12M9 12h12M9 18h12"/><path d="M3 6h2M3 12h2M3 18h2"/>',chart:'<path d="M4 20V11"/><path d="M10 20V4"/><path d="M16 20v-9"/><path d="M22 20H2"/>',tax:'<rect x="5" y="2.5" width="14" height="19" rx="2"/><path d="M8.5 7h7M8.5 11h2M13.5 11h2M8.5 15h2M13.5 15h2"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06-1.9 1.9-.06-.06A1.65 1.65 0 0 0 16 18.4a1.65 1.65 0 0 0-1 .74L14 21h-4l-.97-1.86A1.65 1.65 0 0 0 8 18.4a1.65 1.65 0 0 0-1.82.33l-.06.06-1.9-1.9.06.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-.74-1L2 13v-2l1.86-.97A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06-1.9-1.9.06-.06A1.65 1.65 0 0 0 8 5.6a1.65 1.65 0 0 0 1-.74L10 3h4l.97 1.86A1.65 1.65 0 0 0 16 5.6a1.65 1.65 0 0 0 1.82-.33l.06-.06 1.9 1.9-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 .74 1L22 11v2l-1.86.97a1.65 1.65 0 0 0-.74 1.03Z"/>'};
const tabs=[['home','home','給与'],['month','list','月'],['year','chart','年間'],['tax','tax','税金'],['settings','settings','設定']];

function nav(){for(const [id,mobile] of [['#side-nav',false],['#mobile-nav',true]]){$(id).innerHTML=tabs.map(([key,icon,label])=>`<button class="${mobile?'':'nav-btn '}${ui.tab===key?'active':''}" data-action="tab" data-tab="${key}" ${ui.tab===key?'aria-current="page"':''}>${ico(icon)}<span>${label}</span></button>`).join('');}}
function monthPicker(){return `<div class="controls"><button class="button sm" data-action="month" data-offset="-1" aria-label="前月">‹</button><input id="month-value" type="month" aria-label="振込月" value="${ui.month}" class="control month-control"><button class="button sm" data-action="month" data-offset="1" aria-label="翌月">›</button></div>`}

function top(title,control=''){return `<div class="topbar"><h1>${title}</h1>${control}</div>`}
function kindName(k){return {full:'常勤',weekly:'定期',spot:'スポット'}[k]||k}
function rowHTML(x){const a=actual(x.e,x.r),label=a?'<span class="pill">確定</span>':'<span class="pill gray">予想</span>',total=a?a.net:x.f.total;
 return `<div class="rowline"><div class="lead"><b>${esc(x.e.name)}</b> ${label}<div class="sub">${x.date?dayISO(x.date).slice(5).replace('-','/')+' 振込':'振込日未設定'}${x.e.kind==='weekly'&&x.f.days!==null?` · ${x.f.days}回`:''}${x.scheduled!==ui.month?' · '+monthText(x.scheduled)+'分':''}</div>${a?`<div class="sub">確定支給 ${money(a.total)} ／ 源泉 ${money(a.incomeTax)}</div>`:''}</div><div class="right"><div class="money">${money(total)}</div><div class="sub">${a?'手取り':'予想支給'}</div><div class="actions"><button class="button sm" data-action="entry" data-eid="${esc(x.e.id)}" data-month="${x.scheduled}">編集</button></div></div></div>`;
}
function home(){const rows=salaryRows(ui.month),s=sumRows(rows);return top('給与',monthPicker())+`

 <div class="kpi-grid"><div class="card kpi"><div class="caption">予想</div><strong>${money(s.forecast)}</strong></div><div class="card kpi"><div class="caption">確定支給</div><strong>${money(s.confirmedGross)}</strong></div><div class="card kpi"><div class="caption">確定手取り</div><strong>${money(s.net)}</strong></div></div>

function monthPage(){const rows=salaryRows(ui.month),groups=new Map();for(const x of rows){const day=x.date?dayISO(x.date):'';if(!groups.has(day))groups.set(day,[]);groups.get(day).push(x)}const items=[...groups].sort((a,b)=>!a[0]?1:!b[0]?-1:a[0].localeCompare(b[0]));const total=sumRows(rows);
 return top('月',monthPicker())+`<div class="hero"><small>${monthText(ui.month)}の予想振込額</small><strong>${money(total.forecast)}</strong></div>`+(items.length?items.map(([day,group])=>`<section class="card summary-block"><div class="summary-title"><h2>${day?Number(day.slice(-2))+'日':'日付未設定'}</h2><strong>${money(group.reduce((s,x)=>s+x.f.total,0))}</strong></div>${group.map(x=>`<div class="summary-item"><div><b>${esc(x.e.name)}</b><div class="sub">${actual(x.e,x.r)?'確定':'予想'} · ${monthText(x.scheduled)}分</div></div><div class="actions"><span class="money">${money(x.f.total)}</span><button class="button sm" data-action="entry" data-eid="${esc(x.e.id)}" data-month="${x.scheduled}">編集</button></div></div>`).join('')}</section>`).join(''):'<div class="empty">給与がありません</div>');}
function yearPage(){const months=annualRows(ui.year),all=months.flat(),s=sumRows(all);return top('年間',yearPicker())+`<div class="hero"><small>${ui.year}年の支給額（確定＋予想）</small><strong>${money(s.expected)}</strong></div><div class="kpi-grid"><div class="card kpi"><div class="caption">予想額面</div><strong>${money(s.forecast)}</strong></div><div class="card kpi"><div class="caption">確定支給</div><strong>${money(s.confirmedGross)}</strong></div><div class="card kpi"><div class="caption">確定手取り</div><strong>${money(s.net)}</strong></div></div>
 <section class="card"><h2>月別</h2><div class="table-scroll"><table><thead><tr><th>月</th><th>予想</th><th>確定支給</th><th>手取り</th></tr></thead><tbody>${months.map((rows,i)=>{const t=sumRows(rows);return `<tr><td>${i+1}月</td><td>${money(t.forecast)}</td><td>${money(t.confirmedGross)}</td><td>${money(t.net)}</td></tr>`}).join('')}</tbody></table></div></section>`;}
// 2026・2027年分の制度に限定。2028年以降の控除額を推測しない。
function salaryDeduction(g){if(g<=2200000)return Math.min(g,740000);if(g<=3600000)return g*.30+80000;if(g<=6600000)return g*.20+440000;if(g<=8500000)return g*.10+1100000;return 1950000;}
function baseDeduction(income){if(income<=4890000)return 1040000;if(income<=6550000)return 670000;if(income<=23500000)return 620000;if(income<=24000000)return 480000;if(income<=24500000)return 320000;if(income<=25000000)return 160000;return 0;}
function taxBracket(t){for(const [limit,rate,less] of [[1950000,.05,0],[3300000,.10,97500],[6950000,.20,427500],[9000000,.23,636000],[18000000,.33,1536000],[40000000,.40,2796000],[Infinity,.45,4796000]])if(t<limit)return {rate,less};return {rate:.45,less:4796000};}
function taxCalc(gross,social,dc,ideco,medical,donated){const income=Math.max(0,gross-salaryDeduction(gross)),basic=baseDeduction(income),donationDed=Math.max(0,Math.min(Math.max(0,donated-2000),income*.4));const taxable=Math.max(0,Math.floor((income-basic-social-dc-ideco-medical-donationDed)/1000)*1000),b=taxBracket(taxable);return {income,basic,taxable,donationDed,rate:b.rate,tax:Math.floor(Math.max(0,taxable*b.rate-b.less)*1.021)};}
function profile(y){const p=db.tax[String(y)]||{};return {ideco:n(p.ideco),medical:n(p.medical),extraIncome:n(p.extraIncome),futureSocial:n(p.futureSocial),donation:n(p.donation)};}
function taxStats(y){const p=profile(y),rows=yearRows(y);let confirmedGross=0,unconfirmedGross=0,actualSocial=0,actualDC=0,futureDC=0,withheld=0;
 for(const x of rows){const a=actual(x.e,x.r);if(a){confirmedGross+=a.taxable;actualSocial+=a.social;actualDC+=a.dc;withheld+=a.incomeTax;}else{unconfirmedGross+=x.f.taxable;futureDC+=x.f.dc;}}
 const current=taxCalc(confirmedGross,actualSocial,actualDC,p.ideco,p.medical,p.donation);
 const futureGross=confirmedGross+unconfirmedGross+p.extraIncome;
 const futureSocial=actualSocial+p.futureSocial;
 const future=taxCalc(futureGross,futureSocial,actualDC+futureDC,p.ideco,p.medical,0);
 // ふるさと納税：所得割額20％上限の近似。調整控除や自治体差は反映しない。
 const residentIncome=Math.max(0,future.income-futureSocial-actualDC-futureDC-p.ideco-p.medical-430000);
 const residentLevy=Math.max(0,Math.floor(residentIncome/1000)*1000*.10-2500);
 const applicableRate=future.taxable>0?future.rate:0;
 const denominator=.9-applicableRate*1.021;
 const cap=residentLevy<=0||denominator<=0?0:Math.max(0,Math.floor(2000+residentLevy*.2/denominator));
 return {p,current,future,withheld,confirmedGross,unconfirmedGross,actualSocial,actualDC,futureDC,futureGross,residentLevy,cap,payment:current.tax-withheld};}
function field(name,label,value,opts={}){const {nullable=false,hint='',min=0}=opts;return `<div class="field"><label for="f-${name}">${label}</label><input class="control" name="${name}" id="f-${name}" type="number" inputmode="numeric" step="1" min="${min}" value="${has(value)?esc(value):''}" placeholder="${nullable?'未入力':'0'}">${hint?`<span class="hint">${esc(hint)}</span>`:''}</div>`}
function pick(name,label,options,value){return `<div class="field"><label for="f-${name}">${label}</label><select class="control" id="f-${name}" name="${name}">${options.map(([v,l])=>`<option value="${esc(v)}" ${String(value)===String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`}

 <div class="split"><section class="card"><div class="card-head"><h2>所得税</h2><span class="pill amber">概算</span></div><div class="green"><span>暫定予定納税額</span><strong>${signedMoney(r.payment)}</strong></div><div class="sub" style="margin-top:7px">＋納税 ／ −還付</div>
 <div class="rowline"><span>確定給与収入</span><b>${money(r.confirmedGross)}</b></div><div class="rowline"><span>源泉所得税</span><b>${money(r.withheld)}</b></div><div class="rowline"><span>所得税見込</span><b>${money(r.current.tax)}</b></div><div class="rowline"><span>社会保険料</span><b>${money(r.actualSocial)}</b></div><div class="rowline"><span>基礎控除</span><b>${money(r.current.basic)}</b></div>
 <p class="note">確定済み給与だけで試算。未確定給与は含みません。</p></section>
 <section class="card"><div class="card-head"><h2>ふるさと納税</h2><span class="pill amber">概算</span></div><div class="green"><span>寄附上限（1円単位）</span><strong>${money(r.cap)}</strong></div>
 <div class="rowline"><span>寄附済み</span><b>${money(p.donation)}</b></div><div class="rowline"><span>残り目安</span><b>${money(Math.max(0,r.cap-p.donation))}</b></div><div class="rowline"><span>確定給与</span><b>${money(r.confirmedGross)}</b></div><div class="rowline"><span>未確定予想＋追加収入</span><b>${money(r.unconfirmedGross+p.extraIncome)}</b></div><div class="rowline"><span>社会保険料（実績＋予定）</span><b>${money(r.actualSocial+p.futureSocial)}</b></div>
 <p class="note">住民税所得割・税率から試算。実際の上限を保証するものではありません。</p></section></div>
 <section class="card section-gap"><div class="card-head"><h2>試算条件</h2></div><form id="tax-form"><div class="form-grid">
 ${field('ideco','iDeCo（年間拠出額）',p.ideco)}${field('medical','医療費控除額',p.medical)}
 ${field('extraIncome','追加で見込む額面（非課税交通費抜）',p.extraIncome)}${field('futureSocial','今後の社会保険料',p.futureSocial)}
 ${field('donation','ふるさと納税済み',p.donation)}
 </div><div class="modal-bottom"><button class="button primary" type="submit">保存</button></div></form>
 <p class="note">企業型DCは本人拠出として毎月の給与から自動集計。iDeCoには含めず入力してください。</p>
 <div class="warn">住民税は所得税の源泉徴収額ではありません。非課税交通費、会社拠出DC、保険金などが含まれる場合は入力区分をご確認ください。</div></section>`;}

 if(e.kind==='weekly')return `${e.weekday===''?'曜日未設定':wd[Number(e.weekday)]}/祝${e.holiday?'勤務':'休'}　${money(e.daily)} ${p}`;

 <div class="emp-kind" data-kind="full"><div class="divider"></div><div class="form-grid">${field('forecastTotal','月額予想支給（DC差引後）',e.forecastTotal)}${field('travel','交通費／月',e.travel)}${field('dc','企業型DC（本人）／月',e.dc)}</div></div>

function intField(f,key,nullable=false){const el=f.elements[key];if(!el)return nullable?null:0;const raw=el.value.trim();if(!raw)return nullable?null:0;const x=Number(raw);if(!Number.isSafeInteger(x)||x<0||x>10000000000)throw Error(`「${key}」の値を確認してください`);return x;}
function employerSave(form){const name=form.elements.name.value.trim(),kind=form.elements.kind.value;if(!name)throw Error('勤務先名を入力してください');const startMonth=form.elements.startMonth.value,endMonth=form.elements.endMonth.value;if((startMonth&&!validMonth(startMonth))||(endMonth&&!validMonth(endMonth))||(startMonth&&endMonth&&startMonth>endMonth))throw Error('開始月・終了月を確認してください');const old=getEmp(ui.modal.id);const e={id:old?.id||uid(),name,kind,closeDay:intField(form,'closeDay'),payDay:intField(form,'payDay'),lag:intField(form,'lag'),startMonth,endMonth};
 if(kind==='weekly'){Object.assign(e,{weekday:form.elements.weekday.value,holiday:form.elements.holiday.value==='true',daily:intField(form,'daily'),travelPer:intField(form,'travelPer')})}
 if(kind==='full'){Object.assign(e,{forecastTotal:intField(form,'forecastTotal'),travel:intField(form,'travel'),dc:intField(form,'dc')})}
 if(e.lag>3||e.closeDay<1||e.closeDay>32||e.payDay>32)throw Error('締め日・支払日を確認してください');
 if(kind==='full'&&e.forecastTotal<e.travel)throw Error('予想支給額が交通費より少なくなっています');
 if(old)Object.assign(old,e);else db.employers.push(e);
 save();close();render();toast('勤務先を保存しました');if(!old&&ui.spotAfterAdd&&e.kind==='spot'){ui.spotAfterAdd=false;entryModal(e.id,ui.month);}}

 const prediction=e.kind==='full'?`<div class="form-grid">${field('forecastTotal','予想支給総額（DC差引後）',f.total)}${field('travel','交通費',f.travel)}${field('dc','企業型DC（本人）',f.dc)}</div>`:e.kind==='weekly'?`<div class="form-grid">${field('daysOverride','勤務回数（変更時のみ）',r?.daysOverride,{nullable:true,hint:`自動：${f.days===null?'未設定':f.days+'回'}`})}${field('forecastTaxable','予想額面（交通費抜）',r?.forecastTaxable,{nullable:true,hint:`自動：${money(f.taxable)}`})}${field('forecastTravel','予想交通費',r?.forecastTravel,{nullable:true,hint:`自動：${money(f.travel)}`})}</div>`:`<div class="form-grid">${field('forecastTaxable','予想額面（交通費抜）',r?.forecastTaxable)}${field('forecastTravel','予想交通費',r?.forecastTravel)}</div>`;
 const actualForm=e.kind==='full'?`<div class="form-grid">${field('actualTotal','確定支給総額（DC差引後）',r?.actualTotal,{nullable:true})}${field('social','社会保険料',r?.social,{nullable:true})}${field('incomeTax','所得税',r?.incomeTax,{nullable:true})}${field('resident','住民税',r?.resident,{nullable:true})}</div><div class="preview"><span>手取り（自動）</span><b id="net-preview">${a?money(a.net):'—'}</b></div>`:
 `<div class="form-grid">${field('actualGross','確定額面（交通費抜）',r?.actualGross,{nullable:true})}${field('actualTravel','交通費',r?.actualTravel,{nullable:true})}${field('actualNet','手取り（交通費込み）',r?.actualNet,{nullable:true})}</div><div class="preview"><span>源泉所得税（自動）</span><b id="tax-preview">${a?money(a.incomeTax):'—'}</b></div>`;
 const payday=paymentDate(e,m,null);modal(`${e.name} · ${monthText(m)}`,`<form id="entry-form"><h3>予想</h3>${prediction}<div class="preview"><span>予想支給額</span><b id="forecast-preview">${money(f.total)}</b></div><div class="divider"></div><h3 style="margin-bottom:12px">確定</h3>${actualForm}

 if(has(r.actualGross)&&r.actualNet>r.actualGross+r.actualTravel)throw Error('手取りが支給額を超えています。源泉所得税以外の入金や還付がないかご確認ください');

 if(e.kind==='full'){for(const k of ['forecastTotal','travel','dc'])draft[k]=n(f.elements[k].value)}
 else{for(const k of ['forecastTaxable','forecastTravel']){draft[k]=f.elements[k].value.trim()===''?null:n(f.elements[k].value)}if(e.kind==='weekly')draft.daysOverride=f.elements.daysOverride.value.trim()===''?null:n(f.elements.daysOverride.value)}
 const fPrev=$('#forecast-preview');if(fPrev)fPrev.textContent=money(forecast(e,ui.modal.month,draft).total);
 if(e.kind==='full'){
 const keys=['actualTotal','social','incomeTax','resident'],v=keys.map(k=>f.elements[k].value.trim()),el=$('#net-preview');if(el)el.textContent=v.every(x=>x!=='')?money(n(v[0])-n(v[1])-n(v[2])-n(v[3])):'—';
 }else{const keys=['actualGross','actualTravel','actualNet'],v=keys.map(k=>f.elements[k].value.trim()),el=$('#tax-preview');if(el)el.textContent=v.every(x=>x!=='')?money(n(v[0])+n(v[1])-n(v[2])):'—';}}
function taxSave(f){const y=String(ui.year),p={};for(const key of ['ideco','medical','extraIncome','futureSocial','donation'])p[key]=intField(f,key);db.tax[y]=p;save();render();toast('保存しました');}
function download(text,name,mime){const url=URL.createObjectURL(new Blob([text],{type:mime})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),20000)}
function exportJSON(){download(JSON.stringify(db,null,2),'mydoctorpay-v14-backup.json','application/json');toast('バックアップを保存しました')}
function exportCSV(){const lines=[['振込月','実振込日','勤務先','区分','予想支給額','確定支給額','確定交通費','確定手取り','源泉所得税','社会保険料','企業型DC','住民税']];for(let m=1;m<=12;m++){for(const x of salaryRows(monthKey(ui.year,m))){const a=actual(x.e,x.r);lines.push([monthKey(ui.year,m),x.date?dayISO(x.date):'',x.e.name,kindName(x.e.kind),x.f.total,a?.total??'',a?.travel??'',a?.net??'',a?.incomeTax??'',a?.social??'',a?.dc??'',a?.resident??'']);}}const csv='\ufeff'+lines.map(a=>a.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');download(csv,`mydoctorpay-${ui.year}.csv`,'text/csv;charset=utf-8');}
function addSpot(){const es=db.employers.filter(e=>e.kind==='spot');if(!es.length){ui.spotAfterAdd=true;employerModal();return;}if(es.length===1)return entryModal(es[0].id,ui.month);modal('スポット先',`<div class="field"><select class="control" id="spot-select">${es.map(e=>`<option value="${esc(e.id)}">${esc(e.name)}</option>`).join('')}</select></div><div class="modal-bottom"><button class="button" data-action="new-spot">＋ 勤務先</button><button class="button primary" data-action="choose-spot">登録</button></div>`);}
const actions={tab:b=>{ui.tab=b.dataset.tab;render();window.scrollTo(0,0)},month:b=>{ui.month=moveMonth(ui.month,n(b.dataset.offset));ui.year=+ui.month.slice(0,4);render()},year:b=>{ui.year=Math.min(2027,Math.max(2026,ui.year+n(b.dataset.offset)));render()},entry:b=>entryModal(b.dataset.eid,b.dataset.month||ui.month),employer:b=>employerModal(b.dataset.eid||''),close:close,'add-spot':addSpot,'new-spot':()=>{ui.spotAfterAdd=true;employerModal()},'choose-spot':()=>{const e=$('#spot-select').value;close();entryModal(e,ui.month)},'remove-entry':()=>{if(!ui.modal||!confirm('この月の入力を削除しますか？'))return;const {eid,month}=ui.modal;db.entries=db.entries.filter(x=>!(x.employerId===eid&&x.month===month));save();close();render()},'remove-employer':b=>{const e=getEmp(b.dataset.eid);if(!e||!confirm(`${e.name}と、その給与データを削除しますか？`))return;db.entries=db.entries.filter(r=>r.employerId!==e.id);db.employers=db.employers.filter(x=>x.id!==e.id);save();render()},export:exportJSON,import:()=>$('#json-upload').click(),csv:exportCSV,reset:()=>{if(!confirm('すべての給与データを初期化しますか？'))return;db=mkDefault();save();render();toast('初期化しました')}};
 document.addEventListener('click',ev=>{const b=ev.target.closest('[data-action]');if(!b)return;const fn=actions[b.dataset.action];if(!fn)return;ev.preventDefault();try{fn(b)}catch(ex){alert(ex.message)}});
 document.addEventListener('submit',ev=>{const f=ev.target;if(!['employer-form','entry-form','tax-form'].includes(f.id))return;ev.preventDefault();try{if(f.id==='employer-form')employerSave(f);else if(f.id==='entry-form')entrySave(f);else taxSave(f)}catch(ex){alert(ex.message)}});
 document.addEventListener('change',ev=>{const x=ev.target;if(x.id==='month-value'&&validMonth(x.value)){ui.month=x.value;ui.year=+x.value.slice(0,4);render();}else if(x.id==='year-value'){ui.year=Math.min(2027,Math.max(2026,n(x.value)));render()}else if(x.id==='f-kind'){toggleKind()}});
 document.addEventListener('input',ev=>{if(ev.target.closest('#entry-form'))updatePreview()});
 $('#json-upload').addEventListener('change',async ev=>{const file=ev.target.files?.[0];if(!file)return;try{if(file.size>2e6)throw Error('ファイルが大きすぎます');const d=JSON.parse(await file.text());if(!validDB(d))throw Error('v1.4のバックアップ形式ではありません');if(!confirm('現在のデータを置き換えますか？'))return;db=d;save();render();toast('復元しました')}catch(ex){alert(ex.message)}finally{ev.target.value=''}});
 window.addEventListener('keydown',ev=>{if(ev.key==='Escape')close()});
 render();if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
})();
